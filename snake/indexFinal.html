<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Power Outage - Hall of Fame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-bg: #ffffff;
            --cell-bg: #d3d4d5;
            --label-bg: #ffbb42;
            --text-main: #000000;
            --bg-color: #f0f2f5;
            --snake-white: rgba(255, 255, 255, 0.6);
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Animated Background Snake Canvas */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-color: var(--cell-bg);
            opacity: 0.4;
        }

        #header {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            border-bottom: 3px solid var(--label-bg);
            z-index: 10;
        }

        .title { font-weight: 800; font-size: 1.5rem; text-transform: uppercase; }
        .subtitle { font-size: 0.9rem; color: #555; margin-top: 5px; font-weight: bold; }

        /* Scrolling Container */
        #credits-wrap {
            flex: 1;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            position: relative;
            margin-top: 20px;
        }

        #scroll-content {
            position: absolute;
            width: 100%;
            top: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 100px;
        }

        .lb-row {
			background: white;
			margin: 0 20px;
			padding: 15px 20px;
			border-radius: 12px;
			display: flex;
			flex-direction: row;
			align-items: center;
			justify-content: space-between; /* This pushes content to opposite sides */
			box-shadow: 0 4px 10px rgba(0,0,0,0.05);
			border-left: 5px solid var(--label-bg);
		}

		.left-group {
			display: flex;
			align-items: center;
			gap: 10px;
			min-width: 0; /* Allows text truncation if name is too long */
		}

		.right-group {
			display: flex;
			align-items: center;
			position: relative;
			white-space: nowrap;
		}

		.rank { font-weight: 900; color: #666; width: 35px; flex-shrink: 0; }
		.player-name { font-weight: bold; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.score-val { font-family: monospace; font-weight: 900; font-size: 1.2rem; color: #edb92e; }

        #audio-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        .audio-btn {
            background: var(--label-bg);
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px #c98c1a;
        }

        .audio-btn:active { box-shadow: 0 0px #c98c1a; transform: translateY(4px); }

        footer {
            padding: 20px;
            z-index: 10;
            background: linear-gradient(transparent, var(--bg-color));
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="header">
    <div class="title">🏆 ФІНАЛ ЗМАГАНЬ 🏆</br>🐍 ЕЛЕКТРИК-ЗМІЙКИ 🐍</div>
    <div class="subtitle">Зал слави енергонезалежних</div>
</div>

<div id="credits-wrap">
    <div id="scroll-content">
        </div>
</div>

<div id="audio-controls">
    <button class="audio-btn" onclick="toggleMusic()" id="music-toggle">🔇</button>
</div>

<footer>
    <!--<button style="background: #000; color: #fff; border:none; padding: 10px 20px; border-radius: 20px; font-weight: bold;" onclick="window.location.reload()">ОНОВИТИ СПИСОК</button>--!>
</footer>

<audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
	const part1 = "https://script.google.com/macros/s/";
	const part2 = "AKfycbxr9OemBs-vGeQPGzK1VkPinTDKqCyn_iSRM0Yy5ISYxx3BsJUSdaPelikII6l-lKYeUQ";
	const part3 = "/exec?all=true";
    const tg = window.Telegram.WebApp;
    tg.ready();

    // --- Background Animation Logic ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
	const music = document.getElementById('bg-music');
	const iconOn = new Image(); iconOn.src = 'elec-on.svg';	
    let cells = [];
    const cellSize = 30;
	const SVG_SIZE = Math.floor(cellSize * 0.65);
	const iconOffset = (cellSize - SVG_SIZE) / 2;
    let bSnake = [{x: 7, y: 5},{x: 6, y: 5},{x: 5, y: 5}, {x: 4, y: 5}, {x: 3, y: 5}, {x: 2, y: 5}, {x: 1, y: 5}];
    let bDir = {x: 1, y: 0};
	
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resize;
    resize();
	

    function drawBackground() {
        ctx.fillStyle = "#d3d4d5";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Grid
        ctx.strokeStyle = "rgba(0,0,0,0.05)";
        for(let x=0; x<canvas.width; x+=cellSize) {
            for(let y=0; y<canvas.height; y+=cellSize) {
                ctx.strokeRect(x, y, cellSize, cellSize);
            }
        }

        // Move Background Snake
        if (Math.random() < 0.05) {
            const dirs = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
            const newDir = dirs[Math.floor(Math.random()*dirs.length)];
            if (!(newDir.x === -bDir.x && newDir.y === -bDir.y)) bDir = newDir;
        }

        let head = {
            x: (bSnake[0].x + bDir.x + Math.ceil(canvas.width/cellSize)) % Math.ceil(canvas.width/cellSize),
            y: (bSnake[0].y + bDir.y + Math.ceil(canvas.height/cellSize)) % Math.ceil(canvas.height/cellSize)
        };
        bSnake.unshift(head);
        bSnake.pop();

        // Draw Background Snake
        ctx.fillStyle = "rgba(255,255,255,0.5)";
		bSnake.forEach(p => {
            ctx.fillRect(p.x * cellSize, p.y * cellSize, cellSize, cellSize);
            if (iconOn.complete) ctx.drawImage(iconOn, p.x * cellSize + iconOffset, p.y * cellSize + iconOffset, SVG_SIZE, SVG_SIZE);
        });
    }

    setInterval(drawBackground, 150);

    // --- Leaderboard Logic ---
    async function loadHallOfFame() {
        const container = document.getElementById('scroll-content');
		const FINAL_URL = part1 + part2 + part3;
        try {
		const res = await fetch(FINAL_URL, {
		method: 'GET',
		mode: 'cors',
		cache: 'no-cache'
		});

        if (!res.ok) throw new Error('Network response was not ok');
        
        const data = await res.json();
			
			if(!data || data.length === 0) throw new Error("No data");
			
            //const res = await fetch(SHEET_URL);
            //const data = await res.json();
            
            container.innerHTML = data.map((row, i) => {
				const name = row[0];
				const score = row[1];
				const isMobile = row[2];
				let platformIcon = "";
				//if (isMobile === true) platformIcon = '📱';
				//if (isMobile === false) platformIcon = '💻';

				return `
				<div class="lb-row">
					<div class="left-group">
						<div class="rank">#${i + 1}</div>
						<div class="player-name">${name}</div>
					</div>
					<div class="right-group">
						<div class="score-val">${score}&nbsp;💡
						<span style="font-size: 12px; margin-left: 5px; opacity: 0.7;">${platformIcon}</span> </div>
					</div>
				</div>
				`;
			}).join('') + `<div style="text-align:center; padding: 50px; font-weight:bold; color:#888;">ДЯКУЄМО ЗА УЧАСТЬ!</div>`;

            startScrolling();
        } catch (e) {
            container.innerHTML = "<div class='row'>Помилка завантаження даних</div>";
        }
    }
	
	// --- Music Logic ---
    let isPlaying = false;
	
	function toggleMusic() {
        if (isPlaying) {
            music.pause();
            document.getElementById('music-toggle').innerText = "🔇";
        } else {
            music.play().catch(e => console.log("User interaction needed"));
            document.getElementById('music-toggle').innerText = "🎵";
        }
        isPlaying = !isPlaying;
    }

    function startScrolling() {
	
        const content = document.getElementById('scroll-content');
        let pos = window.innerHeight;
        
        function step() {
            pos -= 0.8; // Speed of scroll
            content.style.top = pos + "px";
            
            // Reset scroll when finished
            if (pos < -content.offsetHeight) {
                pos = window.innerHeight;
            }
            requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    loadHallOfFame();
</script>

</body>
</html>
