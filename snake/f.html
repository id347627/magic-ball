<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Power Outage - Hall of Fame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400;700;900&display=swap');

        :root {
            --label-bg: #edb92e;
            --gold-gradient: linear-gradient(135deg, #edb92e, #fff9e6, #edb92e);
            /* Updated to match the dark theme of the previous index */
            --card-bg: rgba(20, 20, 20, 0.05); 
            --text-main: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: #0a0a0a;
            /* Background image with a dark overlay to make gold pop */
            background: 
                linear-gradient(to bottom, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)),
                url('bg1.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.25;
            pointer-events: none;
        }

        /* EPIC HEADER STYLE */
        #header {
            width: 90%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            border-image: var(--gold-gradient) 1;
            z-index: 10;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .title { 
            font-family: 'Oswald', sans-serif;
            font-weight: 800; 
            font-size: 1.5rem; 
            text-transform: uppercase; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .subtitle { 
            font-size: 0.9rem; 
            color: #aaa; 
            margin-top: 5px; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #credits-wrap {
            flex: 1;
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            position: relative;
            z-index: 5;
        }

        #scroll-content {
            position: absolute;
            width: 100%;
            top: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 200px;
        }

        /* EPIC ROW STYLE */
        .lb-row {
            background: var(--card-bg);
            margin: 0 20px;
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(237, 185, 46, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        /* Special styling for top 3 in credits */
        .lb-row:nth-child(1) { border-color: rgba(237, 185, 46, 0.8); background: rgba(237, 185, 46, 0.1); }
        .lb-row:nth-child(2) { border-color: rgba(200, 200, 200, 0.5); }
        .lb-row:nth-child(3) { border-color: rgba(205, 127, 50, 0.5); }

        .left-group {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .rank { 
            font-weight: 900; 
            color: var(--label-bg); 
            font-size: 1.1rem;
            min-width: 25px;
        }

        .player-name { 
            font-weight: 700; 
            font-size: 1.1rem; 
            color: #fff;
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
        }
        
        .score-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .score-val { 
            font-weight: 900; 
            font-size: 1.3rem;
            color: var(--label-bg);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-unit {
            font-size: 1rem;
            filter: none; /* Keep the lightbulb emoji colored */
            -webkit-text-fill-color: initial;
        }

        /* AUDIO BUTTON STYLE */
        #audio-controls {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
        }

        .audio-btn {
            background: #1a1a1a;
            border: 2px solid var(--label-bg);
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(237, 185, 46, 0.4);
            transition: all 0.2s;
        }

        .audio-btn:active { transform: scale(0.9); }

        .thank-you-note {
            text-align: center; 
            padding: 50px 20px; 
            font-weight: 900; 
            color: var(--label-bg);
            font-size: 1.4rem;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(237, 185, 46, 0.5);
        }

        /* LOADING ANIMATION */
        .loading-text {
            text-align: center;
            width: 100%;
            margin-top: 100px;
            font-family: 'Oswald', sans-serif;
            color: var(--label-bg);
            letter-spacing: 3px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.4; transform: scale(0.98); }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="header">
    <div class="title">🏆 ЗАЛ СЛАВИ 🏆<br>ЕЛЕКТРИК-ЗМІЙКИ</div>
    <div class="subtitle">ФІНАЛЬНИЙ РЕЙТИНГ</div>
</div>

<div id="credits-wrap">
    <div id="scroll-content">
        <div class="loading-text">ЗАВАНТАЖЕННЯ...</div>
    </div>
</div>

<div id="audio-controls">
    <button class="audio-btn" onclick="toggleMusic()" id="music-toggle">🔇</button>
</div>

<audio id="bg-music" loop>
    <source src="bg.mp3" type="audio/mpeg">
</audio>

<script>
    const part1 = "https://script.google.com/macros/s/";
    const part2 = "AKfycbxr9OemBs-vGeQPGzK1VkPinTDKqCyn_iSRM0Yy5ISYxx3BsJUSdaPelikII6l-lKYeUQ";
    const part3 = "/exec?all=true";
    const tg = window.Telegram.WebApp;
    tg.ready();

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('bg-music');
    const iconOn = new Image(); iconOn.src = 'elec-on.svg'; 
    let bSnake = [{x: 7, y: 5},{x: 6, y: 5},{x: 5, y: 5}, {x: 4, y: 5}, {x: 3, y: 5}, {x: 2, y: 5}, {x: 1, y: 5}];
    let bDir = {x: 1, y: 0};
    const cellSize = 30;
    const SVG_SIZE = Math.floor(cellSize * 0.65);
    const iconOffset = (cellSize - SVG_SIZE) / 2;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resize;
    resize();

    function drawBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = "rgba(0,0,0,0.05)"; 
        for(let x=0; x<canvas.width; x+=cellSize) {
            for(let y=0; y<canvas.height; y+=cellSize) {
                ctx.strokeRect(x, y, cellSize, cellSize);
            }
        }
        
        if (Math.random() < 0.05) {
            const dirs = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
            const newDir = dirs[Math.floor(Math.random()*dirs.length)];
            if (!(newDir.x === -bDir.x && newDir.y === -bDir.y)) bDir = newDir;
        }

        let head = {
            x: (bSnake[0].x + bDir.x + Math.ceil(canvas.width/cellSize)) % Math.ceil(canvas.width/cellSize),
            y: (bSnake[0].y + bDir.y + Math.ceil(canvas.height/cellSize)) % Math.ceil(canvas.height/cellSize)
        };
        bSnake.unshift(head);
        bSnake.pop();

        bSnake.forEach((p, i) => {
            const alpha = 0.35 * (1 - (i / (bSnake.length - 1)) * 0.4);
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.fillRect(p.x * cellSize, p.y * cellSize, cellSize, cellSize);
            if (iconOn.complete) {
                ctx.drawImage(iconOn, p.x * cellSize + iconOffset, p.y * cellSize + iconOffset, SVG_SIZE, SVG_SIZE);
            }
        });
    }
    setInterval(drawBackground, 150);

    async function loadHallOfFame() {
        const container = document.getElementById('scroll-content');
        const FINAL_URL = part1 + part2 + part3;
        try {
            const res = await fetch(FINAL_URL);
            const data = await res.json();
            
            // This replaces the "Loading" text with the actual list
            container.innerHTML = data.map((row, i) => {
                return `
                <div class="lb-row">
                    <div class="left-group">
                        <div class="rank">${i + 1}</div>
                        <div class="player-name">${row[0]}</div>
                    </div>
                    <div class="right-group">
                        <div class="score-container">
                            <div class="score-val">${row[1]}</div>
                            <div class="score-unit">💡</div>
                        </div>
                    </div>
                </div>`;
            }).join('') + `<div class="thank-you-note">ДЯКУЄМО ЗА УЧАСТЬ!</div>`;

            startScrolling();
        } catch (e) {
            container.innerHTML = "<div style='color: white; text-align:center; margin-top:50px;'>Помилка завантаження</div>";
        }
    }

    function startScrolling() {
        const content = document.getElementById('scroll-content');
        let pos = window.innerHeight;
        function step() {
            pos -= 0.85;
            content.style.top = pos + "px";
            if (pos < -content.offsetHeight) pos = window.innerHeight;
            requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    let isPlaying = false;
    function toggleMusic() {
        if (isPlaying) {
            music.pause();
            document.getElementById('music-toggle').innerText = "🔇";
        } else {
            music.play().catch(e => {});
            document.getElementById('music-toggle').innerText = "🎵";
        }
        isPlaying = !isPlaying;
    }

    loadHallOfFame();
</script>

</body>
</html>
